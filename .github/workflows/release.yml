name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rid: linux-arm
          - rid: linux-arm64
          - rid: osx-x64
          - rid: win-arm64
          - rid: win-x64

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Restore workloads
        run: dotnet workload restore --project src/Server/App.Server.csproj

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/Server/App.Server.csproj
          -c Release
          -r ${{ matrix.rid }}
          -p:OpenApiGenerateDocuments=false

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: fastclock-${{ matrix.rid }}
          path: src/Server/bin/Release/net11.0/${{ matrix.rid }}/fastclock-${{ matrix.rid }}.zip

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '11.0.x'

      - name: Restore workloads
        run: dotnet workload restore --project src/Server/App.Server.csproj

      - name: Generate OpenAPI document
        run: >
          dotnet build src/Server/App.Server.csproj
          -c Release
          -p:OpenApiDocumentsDirectory=${{ github.workspace }}/openapi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: openapi
          path: openapi/fastclock-openapi.json

  release:
    needs: [build, openapi]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.zip
            artifacts/openapi/fastclock-openapi.json
